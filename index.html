  <!-- display=block: text waits (up to 3 seconds) for the web fonts instead of showing in the system
       font and jumping when they arrive. sw.js keeps them, so a return visit has them at once. -->
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=block" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f6f2;
      --surface: #ffffff;
      --panel: #f2f0ea;
      --line: #e3e0d7;
      --text: #1c1d26;
      --muted: #6b6d7e;
      --ink: #1c1d26;
      --accent: #f96262;
      --accent-text: #d1363c;
      --yellow: #ffd84d;
      --yellow-deep: #d9a900;
      --pink: #ff4d7d;
      --mint: #14b8a6;
      --mint-text: #0f766e;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: radial-gradient(1200px 700px at 70% -10%, #fde6e2 0%, transparent 60%), var(--bg);
      color: var(--text);
      font: 15px/1.5 "IBM Plex Sans KR", system-ui, sans-serif;
      display: grid;
      grid-template-columns: 340px 1fr;
      overflow: hidden;
    }
    aside {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 28px 22px;
      border-right: 1px solid var(--line);
      background: var(--surface);
      overflow: hidden;
    }
    /* Only the place list scrolls: the title, the search box, the add form and the drop button
       stay in view however many places there are. */
    aside > * { flex: none; }
    aside > .candidates { flex: 0 1 auto; min-height: 0; display: flex; flex-direction: column; }
    .list-scroll { flex: 0 1 auto; min-height: 96px; overflow-y: auto; overscroll-behavior: contain; margin: 0 -8px; padding: 0 8px; scrollbar-width: thin; }
    h1 {
      font: 400 34px/1.15 "Black Han Sans", sans-serif;
      word-break: keep-all;
      margin: 0;
      letter-spacing: 1px;
    }
    h1 span { color: var(--accent); }
    .sub { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    h2 {
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--muted);
      margin: 0 0 8px;
      font-weight: 500;
      display: flex;
      justify-content: space-between;
    }
    h2 b { color: var(--accent-text); font-weight: 700; }
    ul { list-style: none; margin: 0; padding: 0; }
    #menu-list li, #hidden-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 4px;
      border-bottom: 1px solid var(--line);
    }
    #menu-list li.off .name { color: var(--muted); text-decoration: line-through; }
    #menu-list li.loading { justify-content: center; color: var(--muted); font-size: 13px; border: 0; padding: 18px 4px; }
    .spinner { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
    .check { position: relative; width: 22px; height: 22px; flex: none; cursor: pointer; }
    .check input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
    .check span {
      position: absolute; inset: 0;
      border: 2px solid var(--muted);
      border-radius: 7px;
      transition: background .15s, border-color .15s;
    }
    .check input:checked + span { background: var(--yellow); border-color: var(--yellow); }
    .check input:checked + span::after {
      content: ""; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px;
      border: solid var(--ink); border-width: 0 3px 3px 0; transform: rotate(45deg);
    }
    .check input:focus-visible + span { outline: 2px solid var(--mint); outline-offset: 2px; }
    button { font: inherit; color: inherit; cursor: pointer; }
    button.name {
      flex: 1; text-align: left; background: none; border: 0; padding: 4px 2px; border-radius: 6px;
      font-weight: 500; touch-action: manipulation;
    }
    #name-tip {
      position: fixed; z-index: 6; transform: translateX(-50%); pointer-events: none;
      max-width: calc(100vw - 16px); padding: 5px 10px; border-radius: 8px;
      background: var(--ink); color: var(--surface); font-size: 12px; line-height: 1.3; white-space: nowrap;
      box-shadow: 0 4px 12px rgba(28, 29, 38, 0.25);
    }
    #name-tip[hidden] { display: none; }
    button.name:hover { background: rgba(28, 29, 38, 0.05); }
    span.name { flex: 1; color: var(--muted); }
    input.rename, #add-input {
      flex: 1; min-width: 0;
      background: var(--panel); color: var(--text);
      border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit;
    }
    input.rename:focus, #add-input:focus { outline: 2px solid var(--mint); border-color: transparent; }
    .ghost {
      background: none; border: 1px solid var(--line); border-radius: 999px;
      padding: 2px 10px; font-size: 12px; color: var(--muted);
    }
    .ghost:hover { color: var(--text); border-color: var(--muted); }
    #add-form { display: flex; gap: 8px; margin-top: 10px; }
    #add-form button {
      background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 0 14px; font-weight: 700;
    }
    details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
    details ul { margin-top: 6px; }
    #hidden-wrap { margin: 12px 0 4px; }
    .controls { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }
    .stepper { display: flex; align-items: center; justify-content: space-between; }
    .stepper .num { display: flex; align-items: center; gap: 14px; }
    .stepper button {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--panel); border: 1px solid var(--line); font-size: 18px; font-weight: 700;
    }
    .stepper button:disabled { opacity: .35; cursor: default; }
    #pick-count { font: 400 26px/1 "Black Han Sans", sans-serif; color: var(--accent-text); min-width: 18px; text-align: center; }
    #pick-names { margin: -6px 0 0; min-height: 1.3em; font-size: 13px; color: var(--muted); }
    #drop {
      font: 400 22px/1 "Black Han Sans", sans-serif;
      letter-spacing: 1px;
      padding: 18px;
      border: 0;
      border-radius: 16px;
      color: var(--ink);
      background: var(--yellow);
      box-shadow: 0 6px 0 var(--yellow-deep), 0 14px 30px rgba(217, 169, 0, 0.22);
      transition: transform .08s, box-shadow .08s;
    }
    #drop:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 var(--yellow-deep); }
    #drop:disabled { background: var(--line); color: var(--muted); box-shadow: none; cursor: default; }
    #shuffle {
      font: 700 15px/1 "IBM Plex Sans KR", sans-serif;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      background: var(--panel);
    }
    #shuffle:disabled { color: var(--muted); opacity: .6; cursor: default; }
    #drop-hint { min-height: 1.4em; margin: 0; font-size: 13px; color: var(--accent-text); text-align: center; }
    .foot { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12px; }
    kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-family: inherit; }
    main { position: relative; min-width: 0; min-height: 0; }
    #board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #stage-loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--muted); font-size: 15px; background: #dcebc0; }
    #stage-loading .spinner { width: 20px; height: 20px; }
    #theme-picker {
      position: absolute; top: 14px; right: 14px; z-index: 2;
      display: flex; gap: 2px; padding: 4px;
      background: rgba(255, 255, 255, 0.82); border-radius: 999px;
      box-shadow: 0 4px 14px rgba(20, 30, 20, 0.16);
      backdrop-filter: blur(6px);
    }
    #theme-picker button {
      display: flex; align-items: center; gap: 5px;
      border: 0; background: none; border-radius: 999px;
      padding: 6px 9px; font: inherit; font-size: 13px; color: var(--ink); cursor: pointer;
    }
    #theme-picker button span { font-size: 17px; line-height: 1; }
    #theme-picker button b { display: none; font-weight: 700; }
    #theme-picker button[aria-pressed="true"] { background: #fff; box-shadow: 0 1px 4px rgba(20, 30, 20, 0.18); padding-right: 12px; }
    #theme-picker button[aria-pressed="true"] b { display: inline; }
    #theme-picker button:hover:not([aria-pressed="true"]) { background: rgba(255, 255, 255, 0.7); }
    #theme-picker button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    #result {
      /* At the top, clear of the slots: the camera parks on them and each winner speaks over theirs. */
      position: absolute; left: 50%; top: 16px; transform: translateX(-50%);
      min-width: min(340px, calc(100% - 32px));
      background: rgba(255, 255, 255, 0.97);
      border: 2px solid var(--accent);
      border-radius: 24px;
      padding: 26px 34px 24px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(28, 29, 38, 0.18);
      animation: pop .45s cubic-bezier(.2, 1.6, .4, 1);
      max-width: calc(100% - 32px);
    }
    #result[hidden] { display: none; }
    #result-close {
      position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; padding: 0;
      display: grid; place-items: center; background: none; border: 0; border-radius: 10px; color: var(--muted);
    }
    #result-close:hover { background: var(--panel); color: var(--text); }
    .result-note { margin: 12px 0 0; color: var(--muted); font-size: 12px; }
    #result kbd {
      display: inline-block; margin-left: 4px; padding: 1px 6px; border-radius: 6px;
      border: 1px solid currentColor; font: 600 11px/1.4 "IBM Plex Sans KR", sans-serif; opacity: .55; vertical-align: 2px;
    }
    .result-note kbd { margin: 0 2px; }
    @keyframes pop { from { transform: translate(-50%, -16px) scale(.8); opacity: 0; } }
    #result-title { margin: 0; color: var(--muted); font-size: 14px; letter-spacing: 1px; }
    #result-names { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 12px; margin: 10px 0 20px; }
    #result-names li {
      font: 400 40px/1.1 "Black Han Sans", sans-serif;
      background: var(--chip); color: var(--ink);
      padding: 6px 18px 4px; border-radius: 16px;
      white-space: nowrap;
      display: flex; align-items: center; gap: 10px;
    }
    #result-names .who { display: inline-flex; align-items: center; gap: 6px; font: 700 15px/1 "IBM Plex Sans KR", sans-serif; }
    #result-names .who img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .result-actions { display: flex; gap: 10px; justify-content: center; }
    .result-actions button { border-radius: 12px; padding: 12px 22px; font-weight: 700; font-size: 16px; white-space: nowrap; }
    #confirm { background: var(--yellow); color: var(--ink); border: 0; }
    #retry { background: none; border: 1px solid var(--muted); }
    #toast {
      position: fixed; left: 50%; top: 20px; transform: translate(-50%, -20px);
      background: var(--mint); color: var(--ink); font-weight: 700;
      padding: 10px 18px; border-radius: 999px; opacity: 0; pointer-events: none;
      transition: opacity .2s, transform .2s;
    }
    #toast.error { background: var(--pink); }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    .brand-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
    .icon {
      flex: none; width: 42px; height: 42px; display: grid; place-items: center;
      background: none; border: 1px solid var(--line); border-radius: 12px; color: var(--text);
    }
    .icon:hover { border-color: var(--muted); }
    .brand-actions { display: flex; gap: 8px; }
    .mode-banner {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 5;
      max-width: calc(100% - 32px); padding: 8px 16px; border-radius: 999px;
      background: var(--mint); color: var(--ink); font-size: 12px; font-weight: 700; white-space: nowrap;
      box-shadow: 0 8px 24px rgba(28, 29, 38, 0.2); pointer-events: none;
    }
    .wordmark { display: inline-block; }
    .wordmark img { display: block; height: 36px; width: auto; }
    .beat { display: inline-block; color: var(--accent); animation: beat 1.4s ease-in-out infinite; transform-origin: 50% 60%; }
    @keyframes beat { 0%, 40%, 100% { transform: scale(1); } 10%, 28% { transform: scale(1.08); } }
    @media (prefers-reduced-motion: reduce) { .beat { animation: none; } }
    .icon-btn { flex: none; width: 30px; height: 30px; border: 0; border-radius: 8px; background: none; font-size: 19px; line-height: 1; padding: 0; }
    .icon-btn:hover { background: var(--panel); }
    #icon-picker .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding: 4px 22px 4px; max-height: min(56vh, 460px); overflow-y: auto; }
    #icon-picker .grid h3 { grid-column: 1 / -1; margin: 10px 0 0; font-size: 12px; font-weight: 500; letter-spacing: 1px; color: var(--muted); }
    #icon-picker .grid button { font-size: 24px; padding: 8px 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
    #icon-picker .grid button:hover, #icon-picker .grid button.on { border-color: var(--accent); background: #fff1f0; }
    #icon-picker-auto { background: none; border: 1px solid var(--line); color: var(--muted); }
    .info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .info .name { flex: none; }
    .row-tags { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 2px 2px; background: none; border: 0; text-align: left; }
    .row-tags span, .chips li, .chips button {
      font-size: 11px; line-height: 1; padding: 4px 7px; border-radius: 999px;
      background: #e6f6f4; color: var(--mint-text); border: 0;
    }
    .tag-btn { flex: none; width: 28px; height: 28px; border: 1px dashed var(--line); border-radius: 8px; background: none; color: var(--muted); font-weight: 700; padding: 0; }
    .tag-btn:hover { color: var(--mint-text); border-color: var(--mint); }
    .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
    .meta:empty { display: none; }
    .slots { flex: none; display: flex; align-items: center; gap: 2px; }
    .slots button { width: 20px; height: 20px; border: 1px solid var(--line); border-radius: 6px; background: none; color: var(--muted); font-weight: 700; font-size: 12px; line-height: 1; padding: 0; }
    .slots button:hover:not(:disabled) { color: var(--accent-text); border-color: var(--accent); }
    .slots button:disabled { opacity: .35; cursor: default; }
    .slots b { padding: 0 3px; font-size: 12px; color: var(--accent-text); white-space: nowrap; }
    #tag-editor { width: min(420px, calc(100vw - 32px)); }
    .tag-body { padding: 10px 22px 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 28px; }
    .chips li, .chips button { font-size: 14px; padding: 6px 10px; display: inline-flex; align-items: center; gap: 4px; }
    .chips li button { background: none; padding: 0 2px; font-size: 14px; color: inherit; opacity: .7; }
    .chips li button:hover { opacity: 1; }
    #tag-suggest button { background: var(--panel); color: var(--text); border: 1px solid var(--line); }
    #tag-suggest button:hover { border-color: var(--mint); color: var(--mint-text); }
    #tag-current:empty::before { content: "아직 태그가 없어요"; color: var(--muted); font-size: 13px; align-self: center; }
    #tag-form { display: flex; gap: 8px; margin: 14px 0 6px; }
    #tag-input { flex: 1; min-width: 0; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; }
    #tag-input:focus { outline: 2px solid var(--mint); border-color: transparent; }
    #tag-form button { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 0 14px; font-weight: 700; }
    .tag-label { margin: 12px 0 8px; color: var(--muted); font-size: 12px; }
    .tag-note { color: var(--muted); font-size: 12px; align-self: center; }
    #tag-editor-close { background: var(--yellow); color: var(--ink); border: 0; flex: none; }
    .credit { color: var(--muted); font-size: 12px; }
    .credit b { color: var(--text); font-weight: 700; }
    .search { position: relative; display: block; margin-bottom: 6px; }
    .search svg { position: absolute; left: 10px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    #menu-search {
      width: 100%; background: var(--panel); color: var(--text);
      border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px 8px 34px; font: inherit;
    }
    #menu-search:focus { outline: 2px solid var(--mint); border-color: transparent; }
    #menu-search::placeholder { color: var(--muted); font-size: 13px; }
    .search-empty { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 8px 4px; color: var(--muted); font-size: 13px; }
    .search-empty[hidden] { display: none; }
    .icon svg { width: 22px; height: 22px; }
    dialog {
      width: min(400px, calc(100vw - 32px)); padding: 0;
      background: var(--panel); color: var(--text);
      border: 1px solid var(--line); border-radius: 20px;
      box-shadow: 0 24px 60px rgba(28, 29, 38, 0.2);
    }
    dialog::backdrop { background: rgba(28, 29, 38, 0.35); }
    .dialog-head { display: flex; justify-content: space-between; align-items: center; padding: 20px 22px 6px; }
    .dialog-head h2 { font: 400 24px/1 "Black Han Sans", sans-serif; letter-spacing: 0; color: var(--text); margin: 0; }
    .rows { display: grid; gap: 20px; padding: 14px 22px 8px; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; }
    .row span, .toggle span { font-weight: 700; }
    .row output { color: var(--accent-text); font-weight: 700; min-width: 32px; text-align: right; }
    .row small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
    .row input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
    .toggle { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .toggle input { position: absolute; opacity: 0; }
    .toggle i { position: relative; width: 46px; height: 26px; border-radius: 999px; background: var(--line); transition: background .15s; }
    .toggle i::after {
      content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 3px rgba(28, 29, 38, 0.3); transition: transform .15s;
    }
    .toggle input:checked + i { background: var(--yellow); }
    .toggle input:checked + i::after { transform: translateX(20px); }
    .toggle input:focus-visible + i { outline: 2px solid var(--mint); outline-offset: 2px; }
    .dialog-foot { display: flex; justify-content: space-between; gap: 10px; padding: 16px 22px 20px; }
    .dialog-foot button { border-radius: 12px; padding: 10px 16px; font-weight: 700; }
    #settings-reset { background: none; border: 1px solid var(--line); color: var(--muted); }
    #settings-close { background: var(--yellow); color: var(--ink); border: 0; }
    body[data-phase="running"] #menu-list,
    body[data-phase="running"] #add-form,
    body[data-phase="running"] #hidden-wrap { opacity: .5; pointer-events: none; }
    @media (max-width: 860px) {
      body { grid-template-columns: 1fr; grid-template-rows: 62vh auto; overflow: auto; }
      main { grid-row: 1; }
      aside { grid-row: 2; border-right: 0; border-top: 1px solid var(--line); padding: 20px 16px; overflow: visible; }
      .list-scroll { overflow: visible; }
      #result-names li { font-size: 32px; }
      /* On a phone the top of the board holds the waiting line and its bubbles and the bottom the
         slots: the theme buttons stand small and upright over the right-hand wall instead. */
      #theme-picker { top: 50%; right: 6px; transform: translateY(-50%); flex-direction: column; padding: 3px; }
      #theme-picker button { padding: 5px 7px; }
      #theme-picker button[aria-pressed="true"] { padding-right: 7px; }
      #theme-picker button[aria-pressed="true"] b { display: none; }
    }
  </style>
</head>
<body data-phase="idle">
  <aside>
    <header class="brand">
      <div class="brand-top">
        <span class="wordmark"><img src="https://i.postimg.cc/Mp49v4Hd/wordmark-transparent-x1.png" alt="sunapse" width="135" height="40"></span>
        <div class="brand-actions">
        <a href="stats.html" data-keep-mode class="icon" aria-label="기록과 통계" title="기록과 통계">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20h16M7 16v-5M12 16V6M17 16v-8"/></svg>
        </a>
        <button id="open-settings" class="icon" aria-label="설정" title="설정">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
        </div>
      </div>
      <h1><span class="beat">두근두근</span><br>점심메뉴 고르기</h1>
      <p class="sub">말랑한 구슬이 멈추는 곳이 오늘의 점심</p>
    </header>
    <section class="candidates">
      <h2>오늘 후보 <span><b id="candidate-count">0</b>개</span></h2>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="menu-search" type="search" autocomplete="off" placeholder="가게·태그 검색 · 초성 ㅇㄷ · 줄임말 노피" aria-label="가게 검색">
      </label>
      <div class="list-scroll">
        <ul id="menu-list"><li class="loading" aria-live="polite"><span class="spinner" aria-hidden="true"></span>가게 목록 불러오는 중…</li></ul>
        <p id="search-empty" class="search-empty" hidden><span></span><button type="button" id="search-add" class="ghost">가게로 추가</button></p>
        <details id="hidden-wrap" hidden>
          <summary>숨긴 가게 <span id="hidden-count">0</span>개</summary>
          <ul id="hidden-list"></ul>
        </details>
      </div>
      <form id="add-form" autocomplete="off">
        <input id="add-input" maxlength="20" placeholder="가게 추가" aria-label="새 가게 이름">
        <button type="submit">추가</button>
      </form>
    </section>
    <section class="controls">
      <div class="stepper">
        <h2 style="margin:0">떨어질 사람</h2>
        <span id="pick-count">0명</span>
      </div>
      <p id="pick-names"></p>
      <button id="shuffle">칸 섞기 <kbd>S</kbd></button>
      <button id="drop">구슬 떨어뜨리기</button>
      <p id="drop-hint" role="status"></p>
      <div class="foot">
        <span><kbd>Space</kbd> 떨어뜨리기 · <kbd>R</kbd> 다시</span>
        <span class="credit">made by <b>Garden Ko</b></span>
      </div>
    </section>
  </aside>
  <main>
    <canvas id="board" aria-label="플링코 보드"></canvas>
    <div id="theme-picker" role="group" aria-label="맵 테마"></div>
    <div id="stage-loading" aria-live="polite"><span class="spinner" aria-hidden="true"></span>판 까는 중…</div>
    <div id="result" hidden role="dialog" aria-labelledby="result-title">
      <button id="result-close" aria-label="기록하지 않고 닫기" title="기록하지 않고 닫기 (X 또는 Esc)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <p id="result-title">오늘의 점심은</p>
      <ul id="result-names"></ul>
      <div class="result-actions">
        <button id="confirm">여기 간다! <kbd>Enter</kbd></button>
        <button id="retry">다시 돌리기 <kbd>R</kbd></button>
      </div>
      <p class="result-note"><kbd>X</kbd> 또는 <kbd>Esc</kbd>: 기록 없이 닫고 조건 바꾸기</p>
    </div>
  </main>
  <dialog id="settings" aria-labelledby="settings-title">
    <header class="dialog-head">
      <h2 id="settings-title">설정</h2>
      <button id="settings-dismiss" class="icon" aria-label="닫기" title="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </header>
    <div class="rows">
      <label class="row"><span>구슬 크기</span><output id="set-size-v"></output>
        <input id="set-size" type="range" min="24" max="56"><small id="size-note"></small></label>
      <label class="row"><span>말랑함</span><output id="set-softness-v"></output>
        <input id="set-softness" type="range" min="0" max="100"></label>
      <label class="row"><span>탄력</span><output id="set-bounce-v"></output>
        <input id="set-bounce" type="range" min="0" max="100"></label>
      <label class="toggle"><span>소리</span>
        <input id="set-sound" type="checkbox"><i aria-hidden="true"></i></label>
    </div>
    <footer class="dialog-foot">
      <button id="settings-reset">기본값으로</button>
      <button id="settings-close">닫기</button>
    </footer>
  </dialog>
  <dialog id="icon-picker" aria-labelledby="icon-picker-title">
    <header class="dialog-head">
      <h2 id="icon-picker-title">아이콘 고르기</h2>
      <button id="icon-picker-dismiss" class="icon" aria-label="닫기" title="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </header>
    <div class="grid" id="icon-picker-grid"></div>
    <footer class="dialog-foot">
      <button id="icon-picker-auto">태그·이름으로 자동</button>
    </footer>
  </dialog>
  <dialog id="tag-editor" aria-labelledby="tag-editor-title">
    <header class="dialog-head">
      <h2 id="tag-editor-title">태그</h2>
      <button id="tag-editor-dismiss" class="icon" aria-label="닫기" title="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </header>
    <div class="tag-body">
      <ul class="chips" id="tag-current"></ul>
      <form id="tag-form" autocomplete="off">
        <input id="tag-input" maxlength="40" placeholder="태그 입력 후 Enter · 쉼표로 여러 개" aria-label="새 태그">
        <button type="submit">추가</button>
      </form>
      <p class="tag-label" id="tag-suggest-label">다른 가게에 쓴 태그</p>
      <div class="chips" id="tag-suggest"></div>
    </div>
    <footer class="dialog-foot">
      <span class="tag-note">태그는 없어도 돼요. 검색과 아이콘, 통계에 쓰여요</span>
      <button id="tag-editor-close">완료</button>
    </footer>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="src/ui/plinko/main.js"></script>
</body>
</html>
