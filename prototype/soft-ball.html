<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>말랑 구슬 프로토타입</title>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #14151f; --cream: #f4ead5; --muted: #9a9cb5; --yellow: #ffe066; --line: #2c2f45; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--ink); color: var(--cream);
      font: 14px/1.4 "IBM Plex Sans KR", system-ui, sans-serif;
      display: grid; grid-template-rows: auto 1fr; overflow: hidden;
    }
    header { display: flex; gap: 12px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line); }
    h1 { font: 400 24px/1 "Black Han Sans", sans-serif; margin: 0 auto 0 0; }
    button { font: inherit; color: inherit; cursor: pointer; }
    #drop {
      font: 400 18px/1 "Black Han Sans", sans-serif; padding: 10px 18px; border: 0; border-radius: 12px;
      background: var(--yellow); color: var(--ink);
    }
    .icon {
      width: 42px; height: 42px; display: grid; place-items: center;
      background: none; border: 1px solid var(--line); border-radius: 12px; color: var(--cream);
    }
    .icon:hover { border-color: var(--muted); }
    .icon svg { width: 22px; height: 22px; }
    canvas { width: 100%; height: 100%; display: block; }
    dialog {
      width: min(380px, calc(100vw - 32px)); padding: 0;
      background: #1c1e2d; color: var(--cream);
      border: 1px solid var(--line); border-radius: 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }
    dialog::backdrop { background: rgba(10, 11, 18, 0.6); }
    dialog header { border: 0; padding: 20px 22px 6px; }
    dialog h2 { font: 400 22px/1 "Black Han Sans", sans-serif; margin: 0 auto 0 0; }
    .rows { display: grid; gap: 18px; padding: 14px 22px 8px; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; }
    .row span { font-weight: 700; }
    .row output { color: var(--yellow); font-weight: 700; min-width: 32px; text-align: right; }
    .row small { grid-column: 1 / -1; color: var(--muted); }
    .row input { grid-column: 1 / -1; width: 100%; accent-color: var(--yellow); }
    dialog footer { display: flex; justify-content: space-between; gap: 10px; padding: 14px 22px 20px; }
    dialog footer button { border-radius: 12px; padding: 10px 16px; font-weight: 700; }
    #reset { background: none; border: 1px solid var(--line); color: var(--muted); }
    #close { background: var(--yellow); color: var(--ink); border: 0; }
  </style>
</head>
<body>
  <header>
    <h1>말랑 구슬</h1>
    <button id="drop">떨어뜨리기 (Space)</button>
    <button id="open-settings" class="icon" aria-label="설정" title="설정">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>
  <dialog id="settings" aria-labelledby="settings-title">
    <header>
      <h2 id="settings-title">설정</h2>
      <button id="dismiss" class="icon" aria-label="닫기" title="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </header>
    <div class="rows">
      <label class="row"><span>구슬 크기</span><output id="size-v"></output>
        <input id="size" type="range" min="24" max="56"><small>다음에 떨어뜨릴 때부터 적용돼요</small></label>
      <label class="row"><span>말랑함</span><output id="soft-v"></output>
        <input id="soft" type="range" min="0" max="100"></label>
      <label class="row"><span>탄력</span><output id="bounce-v"></output>
        <input id="bounce" type="range" min="0" max="100"></label>
      <label class="row"><span>구슬 개수</span><output id="count-v"></output>
        <input id="count" type="range" min="1" max="5"></label>
    </div>
    <footer>
      <button id="reset">기본값으로</button>
      <button id="close">닫기</button>
    </footer>
  </dialog>
  <canvas id="c"></canvas>
<script type="module">
const W = 1200;
const G = 2400;
const DT = 1 / 240;
const ITER = 8;
const N = 24;
const PEG_R = 9, BUMPER_R = 18, POINT_R = 2;
const PEG_TOP = 220, PEG_ROWS = 8, ROW_GAP = 125, COL_GAP = 190;
const PEG_BOTTOM = PEG_TOP + (PEG_ROWS - 1) * ROW_GAP;
const DIV_TOP = PEG_BOTTOM + 100, FLOOR = DIV_TOP + 80, H = FLOOR + 70, DIV_HW = 4;
const MENUS = ['김치찌개', '돈까스', '국밥', '짜장면', '쌀국수', '버거', '초밥', '샐러드'];
const COLORS = ['#ffe066', '#4fd1c5', '#ff6b6b', '#8c9eff', '#ff8ad8'];
const BUMPERS = ['1:410', '1:790', '3:600', '5:220', '5:980', '6:505'];

const WALL_BUMP_R = 26;
const pegs = [];
for (let row = 0; row < PEG_ROWS; row++) {
  const y = PEG_TOP + row * ROW_GAP;
  const odd = row % 2;
  // Even rows leave 116px to the wall (wider than a ball). Odd rows stop well short of the
  // wall and get a half-round bump centred on it, which always pushes balls inward:
  // any gap narrower than a ball between a peg and the wall becomes a pocket.
  const first = odd ? 125 + COL_GAP / 2 : 125;
  for (let x = first; x <= W - first + 1; x += COL_GAP) {
    const bumper = BUMPERS.includes(`${row}:${x}`);
    pegs.push({ x, y, r: bumper ? BUMPER_R : PEG_R, bumper, hit: -9 });
  }
  if (odd) {
    pegs.push({ x: 0, y, r: WALL_BUMP_R, bumper: false, hit: -9 });
    pegs.push({ x: W, y, r: WALL_BUMP_R, bumper: false, hit: -9 });
  }
}
const dividers = MENUS.slice(1).map((_, i) => ((i + 1) * W) / MENUS.length);
const dividerCaps = dividers.map((x) => ({ x, y: DIV_TOP, r: DIV_HW, bumper: false, hit: -9 }));
const obstacles = pegs.concat(dividerCaps);

const params = { R: 38, shape: 0.06, pressure: 0.6, edge: 0.5, damping: 0.999, count: 2 };
const $ = (s) => document.querySelector(s);
const SETTINGS_KEY = 'lunch-plinko:settings';
const DEFAULTS = { size: 48, soft: 100, bounce: 60, count: 2 };

function loadSettings() {
  let saved = {};
  try {
    saved = JSON.parse(localStorage.getItem(SETTINGS_KEY)) ?? {};
  } catch {
    // Unreadable or blocked storage: start from the defaults.
  }
  for (const [key, value] of Object.entries({ ...DEFAULTS, ...saved })) $('#' + key).value = value;
}

function saveSettings() {
  const values = Object.fromEntries(Object.keys(DEFAULTS).map((key) => [key, +$('#' + key).value]));
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(values));
  } catch {
    // Settings still apply for this visit when storage is blocked.
  }
}

function readParams() {
  params.R = +$('#size').value;
  const soft = +$('#soft').value / 100;
  const bounce = +$('#bounce').value / 100;
  // Jelly changes shape easily but keeps its volume: softness lowers shape and skin
  // stiffness only, while pressure stays high so crowded balls can't squash into each other.
  params.shape = 0.2 * (1 - soft) + 0.006;
  params.edge = 0.85 - soft * 0.6;
  params.pressure = 0.7 + bounce * 0.25;
  params.damping = 0.992 + bounce * 0.0075;
  params.count = +$('#count').value;
  $('#size-v').textContent = params.R;
  $('#soft-v').textContent = Math.round(soft * 100);
  $('#bounce-v').textContent = Math.round(bounce * 100);
  $('#count-v').textContent = params.count;
}
const settings = $('#settings');
document.querySelectorAll('#settings input').forEach((el) =>
  el.addEventListener('input', () => {
    readParams();
    saveSettings();
  }),
);
$('#open-settings').addEventListener('click', () => settings.showModal());
$('#close').addEventListener('click', () => settings.close());
$('#dismiss').addEventListener('click', () => settings.close());
settings.addEventListener('click', (e) => {
  if (e.target === settings) settings.close();
});
$('#reset').addEventListener('click', () => {
  for (const [key, value] of Object.entries(DEFAULTS)) $('#' + key).value = value;
  readParams();
  saveSettings();
});
loadSettings();
readParams();

let balls = [];
let time = 0;

function makeBall(cx, cy, R, color) {
  const pts = [];
  const rest = [];
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2;
    const x = cx + Math.cos(a) * R, y = cy + Math.sin(a) * R;
    pts.push({ x, y, px: x - (Math.random() - 0.5) * 2, py: y });
    rest.push({ x: Math.cos(a) * R, y: Math.sin(a) * R });
  }
  return {
    pts, rest, R, color,
    area0: Math.PI * R * R * 0.98,
    edge0: 2 * R * Math.sin(Math.PI / N),
    angle: 0, cx, cy, vx: 0, vy: 0, squeeze: 0,
    bumpAt: -9, bounceAt: -9, slotBounces: 0,
    anchorX: cx, anchorY: cy, stillSince: 0, shakes: 0,
  };
}

function setVelocity(b, vx, vy) {
  for (const p of b.pts) { p.px = p.x - vx * DT; p.py = p.y - vy * DT; }
}

const restingInSlot = (b) => b.cy > DIV_TOP - 10 && Math.hypot(b.vx, b.vy) < 80;

// A ball that lands on one already sitting in a slot is flung up and sideways, usually
// over the divider into the neighbouring slot. The sitting ball squishes from the hit.
// Capped per ball: with crowded slots a ball would otherwise ping-pong for many seconds.
const MAX_SLOT_BOUNCES = 2;
function slotBounces() {
  for (const a of balls) {
    if (restingInSlot(a) || time - a.bounceAt < 0.35 || a.slotBounces >= MAX_SLOT_BOUNCES) continue;
    for (const b of balls) {
      if (a === b || !restingInSlot(b) || a.cy >= b.cy) continue;
      if (Math.hypot(a.cx - b.cx, a.cy - b.cy) > a.R + b.R + SKIN + 6) continue;
      const dx = a.cx - b.cx;
      let side = Math.abs(dx) > 6 ? Math.sign(dx) : Math.random() < 0.5 ? -1 : 1;
      const slotWidth = W / MENUS.length;
      if (a.cx + side * slotWidth < 0 || a.cx + side * slotWidth > W) side = -side;
      a.slotBounces += 1;
      setVelocity(a, side * (430 + Math.random() * 120), -(760 + Math.random() * 120));
      for (const p of b.pts) if (p.y < b.cy) p.py -= 5;
      a.bounceAt = time;
      break;
    }
  }
}

// A ball that makes no progress outside the slots (balanced or wedged on a peg; jelly
// jitters in place, so "no progress" means staying within 10px) gets a little shake,
// like tapping a real board.
function shakeStill(b) {
  if (Math.hypot(b.cx - b.anchorX, b.cy - b.anchorY) > 10) {
    b.anchorX = b.cx;
    b.anchorY = b.cy;
    b.stillSince = time;
    b.shakes = 0;
  }
  if (b.cy < DIV_TOP - 10 && time - b.stillSince > 0.8) {
    // Near a wall, always shake toward the middle: piles against the wall re-form otherwise.
    const nearWall = b.cx < 220 || b.cx > W - 220;
    const side = nearWall ? Math.sign(W / 2 - b.cx) : Math.random() < 0.5 ? -1 : 1;
    const power = 1 + 0.5 * Math.min(b.shakes, 4);
    setVelocity(b, side * 300 * power, -240 * power);
    b.shakes += 1;
    b.stillSince = time;
  }
}

function drop() {
  balls = [];
  for (let i = 0; i < params.count; i++) {
    const x = 120 + Math.random() * (W - 240);
    balls.push(makeBall(x, 70 - i * 10, params.R, COLORS[i % COLORS.length]));
  }
}

function centroid(b) {
  let x = 0, y = 0;
  for (const p of b.pts) { x += p.x; y += p.y; }
  b.cx = x / N; b.cy = y / N;
}

function area(b) {
  let a = 0;
  for (let i = 0; i < N; i++) {
    const p = b.pts[i], q = b.pts[(i + 1) % N];
    a += p.x * q.y - q.x * p.y;
  }
  return a / 2;
}

function pushOut(p, cx, cy, minDist, friction) {
  const dx = p.x - cx, dy = p.y - cy;
  const d2 = dx * dx + dy * dy;
  if (d2 >= minDist * minDist) return null;
  const d = Math.sqrt(d2) || 1e-6;
  const nx = dx / d, ny = dy / d;
  p.x = cx + nx * minDist;
  p.y = cy + ny * minDist;
  const vx = p.x - p.px, vy = p.y - p.py;
  const vn = vx * nx + vy * ny;
  const tx = vx - vn * nx, ty = vy - vn * ny;
  p.px += tx * friction;
  p.py += ty * friction;
  return { nx, ny };
}

function constrain(b) {
  for (let i = 0; i < N; i++) {
    const p = b.pts[i], q = b.pts[(i + 1) % N];
    const dx = q.x - p.x, dy = q.y - p.y;
    const d = Math.hypot(dx, dy) || 1e-6;
    const c = ((d - b.edge0) / d) * 0.5 * params.edge;
    p.x += dx * c; p.y += dy * c; q.x -= dx * c; q.y -= dy * c;
  }
  let perim = 0;
  for (let i = 0; i < N; i++) {
    const p = b.pts[i], q = b.pts[(i + 1) % N];
    perim += Math.hypot(q.x - p.x, q.y - p.y);
  }
  const push = ((b.area0 - area(b)) / perim) * params.pressure;
  const moves = b.pts.map((p, i) => {
    const prev = b.pts[(i + N - 1) % N], next = b.pts[(i + 1) % N];
    const tx = next.x - prev.x, ty = next.y - prev.y;
    const l = Math.hypot(tx, ty) || 1e-6;
    return { x: (ty / l) * push, y: (-tx / l) * push };
  });
  b.pts.forEach((p, i) => { p.x += moves[i].x; p.y += moves[i].y; });

  centroid(b);
  let s = 0, c = 0;
  b.pts.forEach((p, i) => {
    const q = b.rest[i], dx = p.x - b.cx, dy = p.y - b.cy;
    s += q.x * dy - q.y * dx;
    c += q.x * dx + q.y * dy;
  });
  b.angle = Math.atan2(s, c);
  const cos = Math.cos(b.angle), sin = Math.sin(b.angle);
  b.pts.forEach((p, i) => {
    const q = b.rest[i];
    const tx = b.cx + q.x * cos - q.y * sin, ty = b.cy + q.x * sin + q.y * cos;
    p.x += (tx - p.x) * params.shape;
    p.y += (ty - p.y) * params.shape;
  });
}

// Pegs are tested against the skin's edges, not only its points: when the jelly stretches,
// a peg slips between two points, ends up inside the body and the ball hangs on it.
function collideEdgeWithPeg(p, q, peg) {
  const ex = q.x - p.x, ey = q.y - p.y;
  const len2 = ex * ex + ey * ey || 1e-6;
  const t = Math.min(1, Math.max(0, ((peg.x - p.x) * ex + (peg.y - p.y) * ey) / len2));
  const cx = p.x + ex * t, cy = p.y + ey * t;
  const dx = cx - peg.x, dy = cy - peg.y;
  const min = peg.r + POINT_R;
  const d2 = dx * dx + dy * dy;
  if (d2 >= min * min) return null;
  const d = Math.sqrt(d2) || 1e-6;
  const nx = dx / d, ny = dy / d;
  const w1 = 1 - t, w2 = t;
  const s = (min - d) / (w1 * w1 + w2 * w2);
  for (const [pt, w] of [[p, w1], [q, w2]]) {
    pt.x += nx * s * w;
    pt.y += ny * s * w;
    const vx = pt.x - pt.px, vy = pt.y - pt.py;
    const vn = vx * nx + vy * ny;
    pt.px += (vx - vn * nx) * 0.2 * w;
    pt.py += (vy - vn * ny) * 0.2 * w;
  }
  return { nx, ny };
}

function inside(pts, x, y) {
  let hit = false;
  for (let i = 0, j = N - 1; i < N; j = i++) {
    const a = pts[i], c = pts[j];
    if ((a.y > y) !== (c.y > y) && x < ((c.x - a.x) * (y - a.y)) / (c.y - a.y) + a.x) hit = !hit;
  }
  return hit;
}

function nearestEdge(pts, x, y) {
  let best = null;
  for (let i = 0; i < N; i++) {
    const p = pts[i], q = pts[(i + 1) % N];
    const ex = q.x - p.x, ey = q.y - p.y;
    const t = Math.min(1, Math.max(0, ((x - p.x) * ex + (y - p.y) * ey) / (ex * ex + ey * ey || 1e-6)));
    const cx = p.x + ex * t, cy = p.y + ey * t;
    const d = Math.hypot(cx - x, cy - y);
    if (!best || d < best.d) best = { p, q, t, cx, cy, d };
  }
  return best;
}

// A peg that ends up inside the body (a ball crushed onto it by others) is expelled by moving
// the whole ball off it. Folding only the nearest skin back fails: the crushing ball pushes it in again.
// The shift uses the body's actual outline (its nearest point along the push direction),
// not its rest radius: a stretched ball moved by R alone still has the peg inside.
function expel(b, x, y, r) {
  const dx = b.cx - x, dy = b.cy - y;
  const d = Math.hypot(dx, dy) || 1e-6;
  const ux = dx / d, uy = dy / d;
  let back = Infinity;
  for (const p of b.pts) back = Math.min(back, (p.x - x) * ux + (p.y - y) * uy);
  const shift = Math.max(0, r - back);
  const sx = ux * shift, sy = uy * shift;
  for (const p of b.pts) { p.x += sx; p.y += sy; p.px += sx; p.py += sy; }
  b.cx += sx;
  b.cy += sy;
}

function collide(b) {
  const reach = b.R * 1.6;
  for (const peg of obstacles) {
    if (Math.abs(b.cx - peg.x) > reach + peg.r || Math.abs(b.cy - peg.y) > reach + peg.r) continue;
    if (inside(b.pts, peg.x, peg.y)) {
      expel(b, peg.x, peg.y, peg.r + POINT_R);
      continue;
    }
    for (let i = 0; i < N; i++) {
      const hit = collideEdgeWithPeg(b.pts[i], b.pts[(i + 1) % N], peg);
      if (!hit) continue;
      peg.hit = time;
      if (peg.bumper && time - b.bumpAt > 0.2) {
        b.bumpAt = time;
        const kick = 1100 * DT;
        for (const q of b.pts) { q.px -= hit.nx * kick; q.py -= hit.ny * kick; }
      }
    }
  }
  for (const p of b.pts) {
    if (p.y > DIV_TOP - 4) {
      for (const x of dividers) {
        if (Math.abs(p.x - x) > DIV_HW + 4) continue;
        const cy = Math.min(Math.max(p.y, DIV_TOP), FLOOR);
        pushOut(p, x, cy, DIV_HW + POINT_R, 0.2);
      }
    }
    if (p.x < POINT_R) { p.x = POINT_R; p.py += (p.y - p.py) * 0.3; }
    if (p.x > W - POINT_R) { p.x = W - POINT_R; p.py += (p.y - p.py) * 0.3; }
    if (p.y > FLOOR - POINT_R) { p.y = FLOOR - POINT_R; p.px += (p.x - p.px) * 0.35; }
  }
}

// Balls keep a thin skin gap between them. Resolving contact before a point gets inside
// matters: once a point is deep in, the nearest edge can be the far side and the fix pushes it through.
const SKIN = 4;
const MERGE_LIMIT = 0.6;
function translate(b, x, y) {
  for (const p of b.pts) { p.x += x; p.y += y; p.px += x; p.py += y; }
  b.cx += x;
  b.cy += y;
}
function collideBalls() {
  // Solver fallback: once two bodies are this deep in each other, edge-by-edge pushes can no
  // longer tell which way is out, so the whole balls are pulled apart first.
  for (let i = 0; i < balls.length; i++) {
    for (let j = i + 1; j < balls.length; j++) {
      const a = balls[i], b = balls[j];
      const min = (a.R + b.R) * MERGE_LIMIT;
      const dx = b.cx - a.cx, dy = b.cy - a.cy;
      const d = Math.hypot(dx, dy);
      if (d >= min) continue;
      const ux = d > 1e-3 ? dx / d : 1, uy = d > 1e-3 ? dy / d : 0;
      const half = (min - d) / 2;
      translate(a, -ux * half, -uy * half);
      translate(b, ux * half, uy * half);
    }
  }
  for (const a of balls) {
    for (const b of balls) {
      if (a === b || Math.hypot(a.cx - b.cx, a.cy - b.cy) > a.R * 1.4 + b.R * 1.4) continue;
      for (const p of a.pts) {
        const ins = inside(b.pts, p.x, p.y);
        const e = nearestEdge(b.pts, p.x, p.y);
        if (!ins && e.d >= SKIN) continue;
        const d = e.d || 1e-6;
        const k = ins ? (d + SKIN) / d : -(SKIN - d) / d;
        const dx = ((e.cx - p.x) * k) / 2, dy = ((e.cy - p.y) * k) / 2;
        p.x += dx;
        p.y += dy;
        const w1 = 1 - e.t, w2 = e.t, s = 1 / (w1 * w1 + w2 * w2);
        e.p.x -= dx * s * w1; e.p.y -= dy * s * w1;
        e.q.x -= dx * s * w2; e.q.y -= dy * s * w2;
      }
    }
  }
}

function step() {
  for (const b of balls) {
    for (const p of b.pts) {
      const vx = (p.x - p.px) * params.damping, vy = (p.y - p.py) * params.damping;
      p.px = p.x; p.py = p.y;
      p.x += vx; p.y += vy + G * DT * DT;
    }
  }
  for (let k = 0; k < ITER; k++) {
    for (const b of balls) constrain(b);
    for (const b of balls) centroid(b);
    collideBalls();
    // Static obstacles get the last word: a neighbour shoving a skin point into a peg must not stick.
    for (const b of balls) collide(b);
  }
  for (const b of balls) {
    centroid(b);
    b.vx = (b.cx - (b.lastCx ?? b.cx)) / DT;
    b.vy = (b.cy - (b.lastCy ?? b.cy)) / DT;
    b.lastCx = b.cx;
    b.lastCy = b.cy;
    let min = Infinity, max = 0;
    for (const p of b.pts) {
      const d = Math.hypot(p.x - b.cx, p.y - b.cy);
      min = Math.min(min, d); max = Math.max(max, d);
    }
    b.squeeze = 1 - min / max;
    shakeStill(b);
  }
  slotBounces();
  time += DT;
}

const canvas = $('#c');
const ctx = canvas.getContext('2d');
let cw = 0, ch = 0, dpr = 1;
function resize() {
  const r = canvas.getBoundingClientRect();
  dpr = Math.min(devicePixelRatio || 1, 2);
  cw = r.width; ch = r.height;
  canvas.width = cw * dpr; canvas.height = ch * dpr;
}
new ResizeObserver(resize).observe(canvas);

function blobPath(b) {
  const pts = b.pts;
  ctx.beginPath();
  const mid = (i) => ({ x: (pts[i].x + pts[(i + 1) % N].x) / 2, y: (pts[i].y + pts[(i + 1) % N].y) / 2 });
  const m0 = mid(N - 1);
  ctx.moveTo(m0.x, m0.y);
  for (let i = 0; i < N; i++) {
    const m = mid(i);
    ctx.quadraticCurveTo(pts[i].x, pts[i].y, m.x, m.y);
  }
  ctx.closePath();
}

function drawBall(b) {
  blobPath(b);
  const g = ctx.createRadialGradient(b.cx - b.R * 0.35, b.cy - b.R * 0.45, b.R * 0.1, b.cx, b.cy, b.R * 1.15);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(0.3, b.color);
  g.addColorStop(1, b.color + 'cc');
  ctx.shadowColor = b.color + '99';
  ctx.shadowBlur = 24;
  ctx.fillStyle = g;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(20,21,31,0.35)';
  ctx.stroke();

  const cos = Math.cos(b.angle), sin = Math.sin(b.angle);
  const squint = Math.min(1, Math.max(0, (b.squeeze - 0.08) * 5));
  for (const side of [-1, 1]) {
    const ex = side * b.R * 0.3, ey = -b.R * 0.08;
    const x = b.cx + ex * cos - ey * sin, y = b.cy + ex * sin + ey * cos;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(b.angle);
    ctx.fillStyle = '#14151f';
    ctx.beginPath();
    ctx.ellipse(0, 0, b.R * 0.085, b.R * 0.12 * (1 - squint * 0.8), 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,107,107,0.45)';
    ctx.beginPath();
    ctx.ellipse(side * b.R * 0.12, b.R * 0.2, b.R * 0.12, b.R * 0.06, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// The board is taller than the screen, so it is drawn at full width and the camera
// follows the balls down instead of shrinking everything to fit.
let camY = null;
function draw(dt = 1 / 60) {
  const s = (cw / (W + 60)) * 0.98;
  const half = ch / (2 * s);
  const focus = balls.length ? balls.reduce((sum, b) => sum + b.cy, 0) / balls.length : 0;
  const target = H * s <= ch ? H / 2 : Math.min(Math.max(focus + 60, half - 30), H - half + 30);
  camY = camY === null ? target : camY + (target - camY) * (1 - Math.exp(-5 * dt));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cw, ch);
  ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * (cw - W * s) / 2, dpr * (ch / 2 - camY * s));
  ctx.fillStyle = '#1c1e2d';
  ctx.beginPath(); ctx.roundRect(-16, -16, W + 32, H + 32, 30); ctx.fill();
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#20233a'); grad.addColorStop(1, '#171827');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, FLOOR);

  const edges = [0, ...dividers, W];
  MENUS.forEach((name, i) => {
    ctx.fillStyle = ['#ff6b6b', '#ffb347', '#ffe066', '#7bd389', '#4fd1c5', '#5ab8ff', '#8c9eff', '#c38bff'][i] + '33';
    ctx.fillRect(edges[i], FLOOR, edges[i + 1] - edges[i], H - FLOOR);
    ctx.fillStyle = '#f4ead5';
    ctx.font = '700 22px "IBM Plex Sans KR"';
    ctx.textAlign = 'center';
    ctx.fillText(name, (edges[i] + edges[i + 1]) / 2, FLOOR + 38);
  });
  ctx.fillStyle = '#f4ead5';
  for (const x of dividers) { ctx.beginPath(); ctx.roundRect(x - DIV_HW, DIV_TOP, DIV_HW * 2, FLOOR - DIV_TOP, DIV_HW); ctx.fill(); }
  ctx.fillRect(0, FLOOR - 2, W, 4);

  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, W, H);
  ctx.clip();
  for (const peg of pegs) {
    const glow = Math.max(0, 1 - (time - peg.hit) / 0.3);
    ctx.fillStyle = peg.bumper ? '#ff5d8f' : glow > 0.3 ? '#fff4c2' : '#f4ead5';
    if (peg.bumper || glow > 0) {
      ctx.globalAlpha = 0.25 + glow * 0.4;
      ctx.beginPath(); ctx.arc(peg.x, peg.y, peg.r * (peg.bumper ? 1.8 : 1) + glow * 10, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.beginPath(); ctx.arc(peg.x, peg.y, peg.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  for (const b of balls) drawBall(b);
}

let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  acc += dt;
  last = now;
  while (acc >= DT) { step(); acc -= DT; }
  draw(dt);
}
window.__advance = (seconds) => { for (let i = 0; i < seconds / DT; i++) step(); draw(seconds); };
window.__balls = () => balls;
$('#drop').addEventListener('click', drop);
document.addEventListener('keydown', (e) => {
  if (e.code !== 'Space' || settings.open) return;
  e.preventDefault();
  drop();
});
resize();
drop();
requestAnimationFrame(frame);
</script>
</body>
</html>
